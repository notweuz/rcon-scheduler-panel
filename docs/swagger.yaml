basePath: /api
definitions:
  errs.FieldError:
    properties:
      code:
        type: string
      param:
        type: string
    type: object
  request.AuthCredentials:
    properties:
      password:
        maxLength: 40
        minLength: 8
        type: string
      username:
        maxLength: 20
        minLength: 3
        type: string
    required:
    - password
    - username
    type: object
  request.CreateJob:
    properties:
      cron:
        maxLength: 75
        type: string
      log_results:
        type: boolean
      name:
        maxLength: 50
        minLength: 3
        type: string
      steps:
        items:
          $ref: '#/definitions/request.Step'
        minItems: 1
        type: array
    required:
    - cron
    - name
    - steps
    type: object
  request.CreateServer:
    properties:
      address:
        maxLength: 255
        minLength: 3
        type: string
      name:
        maxLength: 50
        minLength: 3
        type: string
      password:
        maxLength: 24
        minLength: 8
        type: string
      port:
        maximum: 65535
        minimum: 1
        type: integer
      protocol_id:
        type: integer
    required:
    - address
    - name
    - password
    - port
    - protocol_id
    type: object
  request.ExecuteCommand:
    properties:
      command:
        maxLength: 1000
        type: string
    required:
    - command
    type: object
  request.Step:
    properties:
      command:
        type: string
      wait:
        type: string
    type: object
  request.UpdateServer:
    properties:
      address:
        maxLength: 255
        minLength: 3
        type: string
      name:
        maxLength: 50
        minLength: 3
        type: string
      password:
        maxLength: 24
        minLength: 8
        type: string
      port:
        maximum: 65535
        minimum: 1
        type: integer
      protocol_id:
        type: integer
    required:
    - address
    - name
    - port
    - protocol_id
    type: object
  response.AuthResponse:
    properties:
      token:
        type: string
    type: object
  response.ErrorInfo:
    properties:
      code:
        type: string
      fields:
        additionalProperties:
          $ref: '#/definitions/errs.FieldError'
        type: object
      message:
        type: string
    type: object
  response.ExecuteResult:
    properties:
      response:
        type: string
    type: object
  response.Job:
    properties:
      cron:
        type: string
      id:
        type: integer
      log_results:
        type: boolean
      name:
        type: string
      server_id:
        type: integer
      steps:
        items:
          $ref: '#/definitions/response.Step'
        type: array
    type: object
  response.Meta:
    properties:
      page:
        type: integer
      per_page:
        type: integer
      total:
        type: integer
      total_pages:
        type: integer
    type: object
  response.Protocol:
    properties:
      description:
        type: string
      id:
        type: integer
      name:
        type: string
    type: object
  response.Response:
    properties:
      data: {}
      error:
        $ref: '#/definitions/response.ErrorInfo'
      meta:
        $ref: '#/definitions/response.Meta'
      success:
        type: boolean
    type: object
  response.ServerShort:
    properties:
      address:
        type: string
      created_at:
        type: string
      description:
        type: string
      id:
        type: integer
      name:
        type: string
      port:
        type: integer
      protocol:
        type: string
    type: object
  response.Step:
    properties:
      command:
        type: string
      wait:
        type: string
    type: object
  response.UserShort:
    properties:
      id:
        type: integer
      username:
        type: string
    type: object
info:
  contact: {}
  description: API for RCON Scheduler Panel.
  title: RCON Scheduler Panel API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Validates username and password, then returns a JWT token
      parameters:
      - description: Username and password
        in: body
        name: credentials
        required: true
        schema:
          $ref: '#/definitions/request.AuthCredentials'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/response.AuthResponse'
              type: object
        "400":
          description: Validation error
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorInfo'
              type: object
        "401":
          description: Invalid credentials
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorInfo'
              type: object
      summary: Login
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Creates a new user and returns a JWT token
      parameters:
      - description: Username and password
        in: body
        name: credentials
        required: true
        schema:
          $ref: '#/definitions/request.AuthCredentials'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/response.AuthResponse'
              type: object
        "400":
          description: Validation error
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorInfo'
              type: object
        "403":
          description: Registration is closed
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorInfo'
              type: object
      summary: Register
      tags:
      - auth
  /jobs/{id}:
    delete:
      parameters:
      - description: Job ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "401":
          description: Missing or invalid token
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorInfo'
              type: object
        "404":
          description: Job not found
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorInfo'
              type: object
      security:
      - BearerAuth: []
      summary: Delete job
      tags:
      - jobs
    get:
      parameters:
      - description: Job ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/response.Job'
              type: object
        "401":
          description: Missing or invalid token
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorInfo'
              type: object
        "404":
          description: Job not found
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorInfo'
              type: object
      security:
      - BearerAuth: []
      summary: Get job by ID
      tags:
      - jobs
    put:
      consumes:
      - application/json
      description: Replaces the job and reschedules it.
      parameters:
      - description: Job ID
        in: path
        name: id
        required: true
        type: integer
      - description: Job data
        in: body
        name: job
        required: true
        schema:
          $ref: '#/definitions/request.CreateJob'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/response.Job'
              type: object
        "400":
          description: Validation error or invalid cron
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorInfo'
              type: object
        "401":
          description: Missing or invalid token
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorInfo'
              type: object
        "404":
          description: Job not found
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorInfo'
              type: object
      security:
      - BearerAuth: []
      summary: Update job
      tags:
      - jobs
  /protocols:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/response.Protocol'
                  type: array
              type: object
        "401":
          description: Missing or invalid token
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorInfo'
              type: object
      security:
      - BearerAuth: []
      summary: List protocols
      tags:
      - protocols
  /protocols/{id}:
    get:
      parameters:
      - description: Protocol ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/response.Protocol'
              type: object
        "401":
          description: Missing or invalid token
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorInfo'
              type: object
        "404":
          description: Protocol not found
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorInfo'
              type: object
      security:
      - BearerAuth: []
      summary: Get protocol by ID
      tags:
      - protocols
  /servers:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/response.ServerShort'
                  type: array
              type: object
        "401":
          description: Missing or invalid token
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorInfo'
              type: object
      security:
      - BearerAuth: []
      summary: List servers
      tags:
      - servers
    post:
      consumes:
      - application/json
      description: Adds an RCON server to the panel.
      parameters:
      - description: Server data
        in: body
        name: server
        required: true
        schema:
          $ref: '#/definitions/request.CreateServer'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/response.ServerShort'
              type: object
        "400":
          description: Validation error
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorInfo'
              type: object
        "401":
          description: Missing or invalid token
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorInfo'
              type: object
        "409":
          description: Server already exists
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorInfo'
              type: object
      security:
      - BearerAuth: []
      summary: Create server
      tags:
      - servers
  /servers/{id}:
    delete:
      description: Deletes the server and unschedules its jobs.
      parameters:
      - description: Server ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "401":
          description: Missing or invalid token
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorInfo'
              type: object
        "404":
          description: Server not found
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorInfo'
              type: object
      security:
      - BearerAuth: []
      summary: Delete server
      tags:
      - servers
    get:
      parameters:
      - description: Server ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/response.ServerShort'
              type: object
        "401":
          description: Missing or invalid token
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorInfo'
              type: object
        "404":
          description: Server not found
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorInfo'
              type: object
      security:
      - BearerAuth: []
      summary: Get server by ID
      tags:
      - servers
    put:
      consumes:
      - application/json
      description: Replaces server data. Empty password keeps the current one.
      parameters:
      - description: Server ID
        in: path
        name: id
        required: true
        type: integer
      - description: Server data
        in: body
        name: server
        required: true
        schema:
          $ref: '#/definitions/request.UpdateServer'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/response.ServerShort'
              type: object
        "400":
          description: Validation error
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorInfo'
              type: object
        "401":
          description: Missing or invalid token
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorInfo'
              type: object
        "404":
          description: Server or protocol not found
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorInfo'
              type: object
        "409":
          description: Server already registered
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorInfo'
              type: object
      security:
      - BearerAuth: []
      summary: Update server
      tags:
      - servers
  /servers/{id}/execute:
    post:
      consumes:
      - application/json
      description: Sends a command to the server and returns its response.
      parameters:
      - description: Server ID
        in: path
        name: id
        required: true
        type: integer
      - description: Command
        in: body
        name: command
        required: true
        schema:
          $ref: '#/definitions/request.ExecuteCommand'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/response.ExecuteResult'
              type: object
        "400":
          description: Validation error
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorInfo'
              type: object
        "401":
          description: Missing or invalid token
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorInfo'
              type: object
        "404":
          description: Server not found
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorInfo'
              type: object
        "502":
          description: Server did not respond over RCON
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorInfo'
              type: object
      security:
      - BearerAuth: []
      summary: Execute RCON command
      tags:
      - servers
  /servers/{id}/jobs:
    get:
      parameters:
      - description: Server ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/response.Job'
                  type: array
              type: object
        "400":
          description: Validation error
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorInfo'
              type: object
        "401":
          description: Missing or invalid token
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorInfo'
              type: object
      security:
      - BearerAuth: []
      summary: List server jobs
      tags:
      - jobs
    post:
      consumes:
      - application/json
      description: Adds a new job to the selected server
      parameters:
      - description: Server ID
        in: path
        name: id
        required: true
        type: integer
      - description: Job data
        in: body
        name: job
        required: true
        schema:
          $ref: '#/definitions/request.CreateJob'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/response.Job'
              type: object
        "400":
          description: Validation error or invalid cron
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorInfo'
              type: object
        "401":
          description: Missing or invalid token
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorInfo'
              type: object
        "404":
          description: Server not found
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorInfo'
              type: object
        "409":
          description: Job already exists
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorInfo'
              type: object
      security:
      - BearerAuth: []
      summary: Create job
      tags:
      - jobs
  /users/me:
    get:
      description: Returns the user the token belongs to.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/response.UserShort'
              type: object
        "401":
          description: Missing or invalid token
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorInfo'
              type: object
        "404":
          description: User not found
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorInfo'
              type: object
      security:
      - BearerAuth: []
      summary: Get current user
      tags:
      - users
securityDefinitions:
  BearerAuth:
    description: Enter "Bearer <token>" (token from /auth/login).
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
